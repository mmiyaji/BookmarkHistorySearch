<!DOCTYPE html>
<html data-bs-theme="auto" lang="ja">
<head>
  <meta charset="UTF-8">
  <title data-i18n="ui_pageTitle">Bookmark &amp; History Search</title>

  <!-- 既存のCDN/CSSはそのまま -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- 既存のJS（順序は i18n → 既存の依存 → popup.js の順に） -->
  <script defer src="js/i18n.js"></script>
  <script defer src="js/bootstrap.bundle.min.js"></script>
  <script defer src="color-modes.js"></script>
  <script defer src="popup.js"></script>
</head>
<body>
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h5 class="mb-0" data-i18n="ui_appName">Tadorun</h5>
    <button
      id="openOptions"
      class="btn btn-link text-muted p-0"
      data-i18n-attr="title=ui_openOptionsTitle"
      title="Settings">
      <i class="fas fa-cog fa-lg"></i>
    </button>
  </div>

  <div class="mb-3">
    <div class="input-group">
      <input
        type="text"
        id="searchInput"
        class="form-control"
        data-i18n-attr="placeholder=ui_searchPlaceholder"
        placeholder="Search words (space-separated)">
      <button
        id="clearInputBtn"
        class="btn btn-outline-secondary"
        type="button"
        data-i18n-attr="title=ui_clearTitle"
        title="Clear">
        <i class="fas fa-times"></i>
      </button>
      <button
        class="btn btn-outline-secondary"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#filterPanel"
        aria-expanded="false"
        data-i18n-attr="title=ui_filterTitle"
        title="Filter">
        <i class="fas fa-filter"></i>
      </button>
    </div>
  </div>

  <div class="collapse mb-2" id="filterPanel">
    <div class="card card-body p-2">
      <strong class="small" data-i18n="ui_filterByDomain">Filter by domain</strong>
      <div id="domainFilters" class="form-check small mt-1"></div>
    </div>
  </div>

  <ul class="nav nav-tabs" id="resultTabs">
    <li class="nav-item">
      <button class="nav-link" id="tab-all" data-target="all" type="button">
        <span data-i18n="ui_tab_all">All</span>
        <span class="badge" id="count-all">0</span>
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="tab-bookmarks" data-target="bookmarks" type="button">
        <span data-i18n="ui_tab_bookmarks">Bookmarks</span>
        <span class="badge" id="count-bookmarks">0</span>
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="tab-history" data-target="history" type="button">
        <span data-i18n="ui_tab_history">History</span>
        <span class="badge" id="count-history">0</span>
      </button>
    </li>
  </ul>

  <div id="resultsWrapper">
    <ul id="results-all" class="list-group result"></ul>
    <ul id="results-bookmarks" class="list-group result d-none"></ul>
    <ul id="results-history" class="list-group result d-none"></ul>
  </div>
</body>
</html>
